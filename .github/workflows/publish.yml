name: Publish to ClawHub

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run format:check
        name: Check code formatting

      - run: pnpm run build
        name: Build project

      - run: pnpm run test
        name: Run tests

      # Authenticate with ClawHub
      - name: Authenticate with ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: pnpm dlx clawhub login --token "$CLAWHUB_TOKEN"

      # Compare package.json version against the current ClawHub latest;
      # only publish when the version actually changed (skips duplicates).
      - name: Check for new version
        id: check
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          LATEST=$(pnpm dlx clawhub package inspect @dodaa08/openclaw-plugin-test --json 2>/dev/null |
            node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d.trim());console.log(j.package&&j.package.latestVersion?j.package.latestVersion:'')}catch{console.log('')}})")
          SHOULD=$(node -e '
            const c = process.argv[1].split(".").map(Number);
            const l = (process.argv[2] || "").split(".").filter(Boolean).map(Number);
            if (!l.length) { console.log("true"); process.exit(0); }
            for (let i = 0; i < 3; i++) {
              if ((c[i] || 0) > (l[i] || 0)) { console.log("true"); process.exit(0); }
              if ((c[i] || 0) < (l[i] || 0)) { console.log("false"); process.exit(0); }
            }
            console.log("false");
          ' "$CURRENT" "$LATEST")
          echo "current=$CURRENT latest=$LATEST publish_new=$SHOULD"
          echo "should_publish=$SHOULD" >> "$GITHUB_OUTPUT"

      # Publish to ClawHub (always on a version tag, only on new versions otherwise)
      - name: Publish to ClawHub
        id: publish
        if: ${{ startsWith(github.ref, 'refs/tags/') || steps.check.outputs.should_publish == 'true' }}
        run: |
          pnpm dlx clawhub package publish . \
            --owner @dodaa08 \
            --source-repo RocketChat/OpenClaw.Plugin \
            --source-commit ${{ github.sha }} \
            --source-ref ${{ github.ref_name }} \
            --wait

      # Create GitHub release (optional but nice, only for version tags)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          body: "Published as version ${{ github.ref_name }} to ClawHub"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
