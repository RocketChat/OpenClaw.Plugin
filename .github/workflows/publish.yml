name: Publish to ClawHub

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      
      - run: pnpm install --frozen-lockfile
      
      - run: pnpm run format:check
        name: Check code formatting
      
      - run: pnpm run build
        name: Build project
      
      - run: pnpm run test
        name: Run tests
      
      # Authenticate with ClawHub
      - name: Authenticate with ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: echo "$CLAWHUB_TOKEN" | clawhub login --token
      
      # Publish to ClawHub
      - name: Publish to ClawHub
        run: |
          clawhub package publish . \
            --owner @dodaa08 \
            --source-repo RocketChat/OpenClaw.Plugin \
            --source-commit ${{ github.sha }} \
            --source-ref ${{ github.ref_name }} \
            --wait
      
      # Create GitHub release (optional but nice)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body: "Published as version ${{ github.ref_name }} to ClawHub"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}